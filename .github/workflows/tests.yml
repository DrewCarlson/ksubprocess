name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: 'zulu'
          java-version: |
            11
            17

      - uses: gradle/actions/setup-gradle@76d3b998d4cef76a821dbcee71a9172ce986bb30

      - name: Cache Build files
        uses: actions/cache@638ed79f9dc94c1de1baef91bcab5edaa19451f4
        with:
          path: |
            ~/.konan
            ~/.gradle
            %USERPROFILE%\.konan
            %USERPROFILE%\.gradle
          key: ${{ runner.os }}-${{ hashFiles('gradle.properties') }}

      - name: Test Windows Target
        if: ${{ startsWith(matrix.os, 'windows') }}
        run: ./gradlew windowsTest

      - name: Test Apple Targets
        if: ${{ startsWith(matrix.os, 'macos') }}
        run: ./gradlew macosX64Test macosArm64Test

      - name: Test Linux Target
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: ./gradlew linuxX64Test

      # Kotlin/Native has no Linux arm64 host, so the test binary is built here and run on an arm64 runner
      - name: Build Linux Arm64 Tests
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: ./gradlew linkDebugTestLinuxArm64 :testprograms:shadowJar

      - name: Upload Linux Arm64 Tests
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8
        with:
          name: linux-arm64-tests
          path: |
            build/bin/linuxArm64/debugTest/test.kexe
            testprograms/build/libs/*-all.jar

      - name: Test JVM Target
        run: ./gradlew jvmTest

      - name: Publish Test Reports
        uses: mikepenz/action-junit-report@452832cde25eaa14ca1ff54bd3f667ed0db35755
        if: always()
        with:
          report_paths: 'build/test-results/**/TEST-*.xml'

      - name: Archive test reports
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8
        if: always()
        with:
          name: test-reports-${{ runner.os }}
          path: build/reports/tests/**/**

  linux-arm64-tests:
    needs: [ tests ]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: 'zulu'
          java-version: 17

      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: linux-arm64-tests

      - name: Test Linux Arm64 Target
        env:
          TEST: TESTVAL
        run: |
          export PT_JAVA_EXE="$(which java)"
          export PT_JAR="$(ls "$PWD"/testprograms/build/libs/*-all.jar | head -1)"
          chmod +x build/bin/linuxArm64/debugTest/test.kexe
          ./build/bin/linuxArm64/debugTest/test.kexe
